name: Test

on:
  push:
    branches:
      - feature/*
      - renovate/*
      - dependabot/*
      - copilot/*

jobs:
  build:
    runs-on: rust

    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: https://github.com/actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: rustfmt
    - run: cargo build
    - run: cargo test
    - name: Rustfmt
      uses: https://github.com/actions-rust-lang/rustfmt@v1
