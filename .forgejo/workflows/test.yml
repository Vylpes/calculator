name: Test

on:
  push:
    branches:
      - feature/*
      - renovate/*
      - dependabot/*
      - copilot/*

jobs:
  build:
    runs-on: rust

    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: https://github.com/hecrj/setup-rust-actions@v2
      with:
        rust-version: stable
    - run: cargo build
    - run: cargo test
