name: Test

on:
  push:
    branches:
      - feature/*
      - renovate/*
      - dependabot/*
      - copilot/*

jobs:
  build:
    environment: stage
    runs-on: rust

    steps:
    - uses: actions/checkout@v4
    - name: Setup System Packages
      shell: bash
      run: |
        set -euo pipefail
        apt update -y
        apt install -y \
          pkg-config \
          build-essential \
          curl \
          libpango1.0-dev \
          libpangocairo-1.0-0 \
          libcairo2-dev \
          libglib2.0-dev \
          libgtk-4-dev
    - name: Cargo Build
      shell: bash
      run: |
        set -euo pipefail
        source "$HOME/.cargo/env"
        cargo build
    - name: Cargo Test
      shell: bash
      run: |
        set -euo pipefail
        source "$HOME/.cargo/env"
        cargo test

