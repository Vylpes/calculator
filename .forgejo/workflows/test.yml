name: Test

on:
  push:
    branches:
      - feature/*
      - renovate/*
      - dependabot/*
      - copilot/*

jobs:
  build:
    environment: stage

    runs-on: rust

    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust environment
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        source "$HOME/.cargo/env"
        rustc --version
        cargo --version
    - run: cargo build
    - run: cargo test
