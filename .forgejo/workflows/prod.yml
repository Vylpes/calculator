name: Production

on:
  push:
    tags:
      - '*'

jobs:
  build:
    environment: stage

    runs-on: rust

    steps:
    - uses: actions/checkout@v4
    - name: Setup System Packages
      run: |
        apt update -y
        apt install -y \
          pkg-config \
          build-essential \
          libpango1.0-dev \
          libpangocairo-1.0-0 \
          libcairo2-dev \
          libglib2.0-dev \
          libgtk-4-dev
      shell: bash
    - name: Setup Rust environment
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        source "$HOME/.cargo/env"
        rustc --version
        cargo --version
    - name: Cargo Build
      run: |
        source "$HOME/.cargo/env"
        cargo build --release
    - name: Cargo Test
      run: |
        source "$HOME/.cargo/env"
        cargo test --release
    - name: Upload Binary
      uses: actions/upload-artifact@v3
      with:
          name: calculator-${{ github.run_id }}
          path: target/release/vyxcalc
          if-no-files-found: error

  publish:
    runs-on: rust
    container: archlinux:latest

    steps:
      - uses: actions/checkout@v4
      - name: Download Binary
        uses: actions/download-artifact@v3
        with:
          name: calculator-${{ github.run_id }}
          path: ./artifact
      - run: cp PKGBUILD build/PKGBUILD
      - name: Build Package
        run: |
          cd build
          chmod +x ../artifact/calculator-app
          makepkg --skipinteg
      - name: Upload to Repo
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.FORGEJO_TOKEN }}" \
            -F "file=@$(ls build/*.pkg.tar.zst)" \
            https://forgejo.example.com/api/v1/repos/owner/repo/releases/$RELEASE_ID/assets
